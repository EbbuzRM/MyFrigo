<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><title>MyFrigo: link di accesso / Sign-in link</title></head>
<body style="font-family:Arial,sans-serif;max-width:600px;margin:32px auto;padding:24px;color:#111827;line-height:1.5">
  <h1>MyFrigo</h1>
  <p lang="it">Hai richiesto un link per accedere. Usa il pulsante qui sotto.</p>
  <p lang="en-GB">You requested a sign-in link. Use the button below.</p>
  <p><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 20px;background:#2563eb;color:#fff;text-decoration:none;border-radius:6px">Accedi / Sign in</a></p>
  <p lang="it">Se non hai richiesto l’accesso, ignora questa email.</p>
  <p lang="en-GB">If you did not request this link, ignore this email.</p>
</body>
</html>
